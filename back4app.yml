version: 1
ports:
  - port: 8081
    http: true
health:
  path: /actuator/health
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 5
env:
  # === BASE DE DONNÉES ===
  - name: DB_URL
    value: "jdbc:postgresql://postgres:5432/mutuelle"
  - name: DB_USERNAME
    value: "postgres"
  - name: DB_PASSWORD
    value: "admin"
  - name: JPA_DDL_AUTO
    value: "update"
  
  # === PROFIL ACTIF ===
  - name: SPRING_PROFILES_ACTIVE
    value: "prod"
  
  # === SERVER ===
  - name: SERVER_PORT
    value: "8081"
  
  # === KEYCLOAK ===
  - name: KEYCLOAK_AUTH_SERVER_URL
    value: "http://keycloak:8080"
  - name: KEYCLOAK_REALM
    value: "mutuelle-realm"
  - name: KEYCLOAK_ADMIN_USERNAME
    value: "soumaila"
  - name: KEYCLOAK_ADMIN_PASSWORD
    value: "admin"
