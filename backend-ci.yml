name: Backend-mutuelle CI/CD

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend_mutuelle/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '/mut/**'

env:
  JAVA_VERSION: '17'
  DOCKER_IMAGE: mutuelle-backend

jobs:
  test:
    name: Tests et compilation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend_mutuelle

    steps:
      - name:  Checkout code
        uses: actions/checkout@v4

      - name:  Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      - name:  Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name:  Compilation
        run: mvn clean compile

      - name:  Tests unitaires
        run: mvn test

      - name:  Package
        run: mvn package -DskipTests

      - name:  Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend_mutuelle/target/*.jar

  docker-build:
    name: Build image Docker
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name:  Checkout code
        uses: actions/checkout@v4

      - name:  Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: backend_mutuelle/target/

      - name:  Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🐳 Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend_mutuelle
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/mutuelle-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/mutuelle-backend:${{ github.sha }}

      - name:  Trigger deploy (optionnel)
        if: success()
        run: |
          curl -X POST ${{ secrets.DEPLOY_WEBHOOK_URL }}