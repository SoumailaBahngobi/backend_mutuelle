spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/mutuelle
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: mutuelle-client
            client-secret: oLSIYm6fogqS020LOwLslSOI78CCa0qM
            scope: openid,profile,email
            authorization-grant-type: authorization_code
            redirect-uri: "http://localhost:8088/login/oauth2/code/keycloak"
        provider:
          keycloak:
            issuer-uri: http://localhost:8080/realms/mutuelle-realm
            user-name-attribute: preferred_username
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/mutuelle-realm
          jwk-set-uri: http://localhost:8080/realms/mutuelle-realm/protocol/openid-connect/certs

server:
  port: 8082

logging:
  level:
    org.springframework.security: DEBUG
    com.wbf.mutuelle: DEBUG