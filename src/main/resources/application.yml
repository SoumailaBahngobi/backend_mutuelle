spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/mutuelle
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: true

  liquibase:
    enabled: false

  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: mutuelle-client
            client-secret: ""  # Laissé vide car public client
            scope: openid,profile,email
            authorization-grant-type: authorization_code
            redirect-uri: "http://localhost:8081/login/oauth2/code/keycloak"
        provider:
          keycloak:
            issuer-uri: http://localhost:8088/realms/mutuelle-realm
            user-name-attribute: preferred_username  # CORRIGÉ
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8088/realms/mutuelle-realm
          jwk-set-uri: http://localhost:8088/realms/mutuelle-realm/protocol/openid-connect/certs

server:
  port: 8081

logging:
  level:
    org.springframework.security: DEBUG
    com.wbf.mutuelle: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

# Configuration Keycloak Admin Client
keycloak:
  auth-server-url: http://localhost:8088
  realm: mutuelle-realm
  admin-username: soumaila  # Utilisateur créé dans Keycloak
  admin-password: admin      # Mot de passe de l'utilisateur

