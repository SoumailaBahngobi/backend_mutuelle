spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mutuelle}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: true

  liquibase:
    enabled: false

  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: ${KEYCLOAK_CLIENT_ID:mutuelle-client}
            client-secret: ${KEYCLOAK_CLIENT_SECRET:}
            scope: openid,profile,email
            authorization-grant-type: authorization_code
            redirect-uri: ${KEYCLOAK_REDIRECT_URI:http://localhost:8081/login/oauth2/code/keycloak}
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8088/realms/mutuelle-realm}
            user-name-attribute: preferred_username
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8088/realms/mutuelle-realm}
          jwk-set-uri: ${KEYCLOAK_JWK_URI:http://localhost:8088/realms/mutuelle-realm/protocol/openid-connect/certs}

  mail:
    host: ${MAIL_HOST:sandbox.smtp.mailtrap.io}
    port: ${MAIL_PORT:2525}
    username: ${MAIL_USERNAME:11718c5ca3ad0f}
    password: ${MAIL_PASSWORD:c64830121b1c0a}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  port: ${SERVER_PORT:8081}

logging:
  level:
    org.springframework.security: ${LOG_LEVEL_SECURITY:DEBUG}
    com.wbf.mutuelle: ${LOG_LEVEL_APP:DEBUG}
    org.hibernate.SQL: ${LOG_LEVEL_SQL:DEBUG}
    org.hibernate.orm.jdbc.bind: ${LOG_LEVEL_JDBC:TRACE}

keycloak:
  auth-server-url: ${KEYCLOAK_AUTH_SERVER_URL:http://localhost:8088}
  realm: ${KEYCLOAK_REALM:mutuelle-realm}
  admin-username: ${KEYCLOAK_ADMIN_USERNAME:soumaila}
  admin-password: ${KEYCLOAK_ADMIN_PASSWORD:admin}

kkiapay:
  base-url: ${KKIAPAY_BASE_URL:https://kkiapay-redirect.com}
  api-key: ${KKIAPAY_API_KEY:tpk_3011c9e2170a11f1b6a0874a5fa1f25d}
  secret-key: ${KKIAPAY_SECRET_KEY:sk_8ec7612a1b6755a98cdc7bf234d32fb3a3b6f70c8a5dc2f465dcf25532e71fa2}
  private-key: ${KKIAPAY_PRIVATE_KEY:pk_5195b216408e751d95d4a4c2e65d19249cb14fc2faee8094d4c4d2415fa9a295}
  public-key: ${KKIAPAY_PUBLIC_KEY:23c4757a0601fabd4c3d9e1bb5992c80a0db12cc}
  callback-url: ${KKIAPAY_CALLBACK_URL:http://localhost:8081/api/payments/callback}
  success-url: ${KKIAPAY_SUCCESS_URL:http://localhost:3000/payment/success}
  error-url: ${KKIAPAY_ERROR_URL:http://localhost:3000/payment/error}
  timeout: ${KKIAPAY_TIMEOUT:30000}
  sandbox: ${KKIAPAY_SANDBOX:true}

admin:
  registration:
    secret: ${ADMIN_REGISTRATION_SECRET:SUPER_SECRET_2024}