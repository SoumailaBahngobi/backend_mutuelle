spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/mutuelle
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false  # Bonne pratique : désactiver l'anti-pattern Open-In-View

  # IMPORTANT: Désactiver Liquibase si vous utilisez Hibernate ddl-auto
  liquibase:
    enabled: false

  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: mutuelle-client
            client-secret: ${KEYCLOAK_CLIENT_SECRET:}  # Laissez vide ou utilisez variable d'env
            scope: openid,profile,email
            authorization-grant-type: authorization_code
            redirect-uri: "http://localhost:8081/login/oauth2/code/keycloak"  # CORRIGÉ: port 8081
        provider:
          keycloak:
            issuer-uri: http://localhost:8088/realms/mutuelle-realm
            user-name-attribute: preferred_username
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8088/realms/mutuelle-realm
          jwk-set-uri: http://localhost:8088/realms/mutuelle-realm/protocol/openid-connect/certs

server:
  port: 8081  # Votre application tourne sur 8081

logging:
  level:
    org.springframework.security: DEBUG
    com.wbf.mutuelle: DEBUG
    org.hibernate.SQL: DEBUG  # Pour voir les requêtes SQL
    org.hibernate.orm.jdbc.bind: TRACE  # Pour voir les paramètres des requêtes

#  AJOUT OBLIGATOIRE - Configuration Keycloak Admin Client
keycloak:
  auth-server-url: http://localhost:8080
  realm: mutuelle-realm
  client-id: mutuelle-client
  client-secret: ${KEYCLOAK_CLIENT_SECRET:}  # Même secret que plus haut
  admin-username: admin
  admin-password: admin
  event-secret: ${KEYCLOAK_EVENT_SECRET:change_me}  # Secret partagé pour le webhook d'événements